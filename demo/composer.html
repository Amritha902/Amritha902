<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PromptComplete — demo composer</title>
    <link rel="stylesheet" href="../src/overlay.css" />
    <style>
      /* A Claude-flavored demo canvas: warm cream, centered composer.
         This is a development harness for screenshots and E2E tests —
         deliberately unbranded. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f0eee5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #3d3929;
      }
      .greeting {
        font-size: 34px;
        font-weight: 400;
        color: #5e5a4e;
        margin-bottom: 34px;
        font-family: Georgia, "Times New Roman", serif;
      }
      .greeting .star { color: #cc785c; margin-right: 10px; }
      .composer {
        width: min(720px, 90vw);
        background: #fdfcfa;
        border: 1px solid #e3dfd3;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(60, 50, 40, 0.08);
        padding: 18px 20px 14px;
      }
      .input {
        min-height: 52px;
        max-height: 240px;
        overflow-y: auto;
        outline: none;
        font-size: 16px;
        color: #3d3929;
        white-space: pre-wrap;
      }
      .input:empty::before {
        content: "How can I help you today?";
        color: #a9a498;
        pointer-events: none;
      }
      .composer-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        color: #a9a498;
        font-size: 13px;
      }
      .send {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 10px;
        background: #cc785c;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .badge {
        position: fixed;
        bottom: 14px;
        left: 14px;
        font-size: 11px;
        color: #a9a498;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <div class="greeting"><span class="star">✳</span>Good morning</div>
    <div class="composer">
      <div class="input" contenteditable="true" role="textbox" aria-label="Message input"></div>
      <div class="composer-bar">
        <span>PromptComplete active — Tab accepts · / for scaffolds</span>
        <button class="send" aria-label="Send">↑</button>
      </div>
    </div>
    <div class="badge">PromptComplete demo composer (not affiliated with any AI provider)</div>
    <script src="harness.js"></script>
    <script src="../src/templates.js"></script>
    <script src="../src/suggest.js"></script>
    <script src="../src/health.js"></script>
    <script src="../src/palette.js"></script>
    <script src="../src/content.js"></script>
  </body>
</html>
