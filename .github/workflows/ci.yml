name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Unit tests (model, tiers, guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    name: E2E (real scripts in the demo composer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Icons build
        run: node tools/gen-icons.mjs
      - name: Store package builds cleanly
        run: node tools/pack.mjs
      - name: E2E assertions (every advertised interaction)
        run: node tests/e2e.test.mjs
      - name: E2E pages (dashboard, options, popup)
        run: node tests/pages.test.mjs
      - name: Real-extension smoke test (MV3 worker in Chrome)
        run: node tests/extension.test.mjs
      - name: Drive the demo composer and capture screenshots
        run: node demo/capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-shots
          path: demo/shots/
